<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">外贸网站技术选型 · 八层总览</title><desc id="desc">建设方案与运行获客二分，覆盖八个选型模块。完整 32 组知识点见知识树。</desc>
<rect width="1200" height="700" fill="#f5f7f3"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#183139">
<text x="56" y="67" font-size="43" fill="#183139" font-weight="700">外贸网站技术选型</text>
<text x="56" y="108" font-size="24" fill="#546c73" font-weight="400">用业务需求选技术，把网站接到询盘与运营。</text>
<path d="M76 203 V596" stroke="#176d64" stroke-width="2" fill="none"/>
<rect x="56" y="150" width="520" height="54" rx="8" fill="#176d64"/>
<text x="76" y="186" font-size="26" fill="#ffffff" font-weight="600">A  网站怎么建</text>
<path d="M76 257 H101" stroke="#176d64" stroke-width="2"/>
<text x="112" y="265" font-size="26" fill="#183139" font-weight="600">01 · 业务目标与建站路线</text>
<text x="112" y="301" font-size="22" fill="#546c73" font-weight="400">目标 / 平台 / 开发路线</text>
<path d="M76 359 H101" stroke="#176d64" stroke-width="2"/>
<text x="112" y="367" font-size="26" fill="#183139" font-weight="600">02 · 内容与数据</text>
<text x="112" y="403" font-size="22" fill="#546c73" font-weight="400">产品模型 / 编辑 / 系统集成</text>
<path d="M76 461 H101" stroke="#176d64" stroke-width="2"/>
<text x="112" y="469" font-size="26" fill="#183139" font-weight="600">03 · 前端与交互</text>
<text x="112" y="505" font-size="22" fill="#546c73" font-weight="400">页面结构 / 交互 / 开发框架</text>
<path d="M76 563 H101" stroke="#176d64" stroke-width="2"/>
<text x="112" y="571" font-size="26" fill="#183139" font-weight="600">04 · 页面渲染方式</text>
<text x="112" y="607" font-size="22" fill="#546c73" font-weight="400">SSG / ISR / SSR / CSR</text>
<path d="M644 203 V596" stroke="#375f96" stroke-width="2" fill="none"/>
<rect x="624" y="150" width="520" height="54" rx="8" fill="#375f96"/>
<text x="644" y="186" font-size="26" fill="#ffffff" font-weight="600">B  网站怎么运行与获客</text>
<path d="M644 257 H669" stroke="#375f96" stroke-width="2"/>
<text x="680" y="265" font-size="26" fill="#183139" font-weight="600">05 · 部署与加速</text>
<text x="680" y="301" font-size="22" fill="#546c73" font-weight="400">源站 / CDN / 性能</text>
<path d="M644 359 H669" stroke="#375f96" stroke-width="2"/>
<text x="680" y="367" font-size="26" fill="#183139" font-weight="600">06 · SEO 与多语言</text>
<text x="680" y="403" font-size="22" fill="#546c73" font-weight="400">索引 / 内容 / 语言 / 站点</text>
<path d="M644 461 H669" stroke="#375f96" stroke-width="2"/>
<text x="680" y="469" font-size="26" fill="#183139" font-weight="600">07 · 询盘与增长</text>
<text x="680" y="505" font-size="22" fill="#546c73" font-weight="400">表单 / 邮件 / CRM / 归因</text>
<path d="M644 563 H669" stroke="#375f96" stroke-width="2"/>
<text x="680" y="571" font-size="26" fill="#183139" font-weight="600">08 · 安全与维护</text>
<text x="680" y="607" font-size="22" fill="#546c73" font-weight="400">权限 / 发布 / 备份 / 总成本</text>
<text x="56" y="661" font-size="23" fill="#176d64" font-weight="400">8 个选型层面 × 每层 4 组知识点 = 32 组  ·  完整二叉树与逐点解释另附</text>
</g></svg>